name: Bug report
description: Report a problem with codebuddy-router
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug!

        **Never paste API keys or tokens.** Redact anything secret before posting.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Node.js, Claude Code, OS/distro.
      placeholder: "node v20.x, claude 2.1.x, Ubuntu 24.04"
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: "`claude-cb doctor` output"
      description: Redact any tokens.
      render: shell
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: "`journalctl --user -u codebuddy-router -n 50` and/or the gateway log."
      render: shell
